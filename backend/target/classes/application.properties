spring.application.name=lankafresh-backend

# --- Database (MySQL) ---
# Never hardcode real credentials here. These fall back to sane local dev
# defaults but should be overridden with real environment variables:
#   DB_NAME, DB_USERNAME, DB_PASSWORD
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:lankafresh}?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# ddl-auto=update is convenient for development (auto-creates/updates tables
# from your @Entity classes). Switch to "validate" before your final demo so
# schema changes are deliberate, not automatic.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080
