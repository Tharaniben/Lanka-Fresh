spring.application.name=lankafresh-backend

# --- Database (MySQL) ---
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:lankafresh}?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Clerk JWT verification ---
# Set CLERK_JWKS_URL in your root .env file:
# CLERK_JWKS_URL=https://your-app.clerk.accounts.dev/.well-known/jwks.json
clerk.jwks.url=${CLERK_JWKS_URL}

# Spring's OAuth2 resource server also needs this to validate the issuer claim
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${CLERK_JWKS_URL}

server.port=8080
